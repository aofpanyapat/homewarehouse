<script>
(()=>{

const uuid=()=>crypto.randomUUID?.()||('id-'+Date.now()+'-'+Math.random().toString(36).slice(2));

const validCode=v=>/^[A-Z0-9_-]{2,48}$/.test(v);
const money=(v)=>Math.round((Number(v)||0)*100)/100;

function sampleData(){const now=today(),id1='BDR-W01-S01',id2='KIT-C01-S01',id3='PET-R01-S01',id4='BTH-C01-S01';return {
 locations:[{id:id1,name:'ตู้เสื้อผ้า A · ชั้น 1',room:'ห้องนอน',createdAt:stamp()},{id:'BDR-W01-S02',name:'ตู้เสื้อผ้า A · ชั้น 2',room:'ห้องนอน',createdAt:stamp()},{id:id2,name:'ตู้ครัว · ชั้น 1',room:'ห้องครัว',createdAt:stamp()},{id:id3,name:'ชั้นวางของแมว · ชั้น 1',room:'มุมของแมว',createdAt:stamp()},{id:id4,name:'ตู้ของใช้ · ชั้น 1',room:'ห้องน้ำ',createdAt:stamp()}],
 items:[{id:'CLO-001',name:'เสื้อยืดสีขาว',category:'เสื้อผ้า',kind:'durable',owner:'ฉัน',locationId:id1,quantity:3,minQty:0,unit:'ตัว',price:199,createdAt:stamp(),archived:false},{id:'CLO-002',name:'กางเกงยีนส์',category:'เสื้อผ้า',kind:'durable',owner:'ฉัน',locationId:'BDR-W01-S02',quantity:2,minQty:0,unit:'ตัว',price:590,createdAt:stamp(),archived:false},{id:'CAT-001',name:'อาหารแมวแบบเม็ด',category:'ของแมว',kind:'consumable',owner:'ส่วนกลาง',locationId:id3,quantity:2,minQty:2,unit:'ถุง',price:250,createdAt:stamp(),archived:false},{id:'CAT-002',name:'ทรายแมว',category:'ของแมว',kind:'consumable',owner:'ส่วนกลาง',locationId:id3,quantity:1,minQty:2,unit:'ถุง',price:150,createdAt:stamp(),archived:false},{id:'KIT-001',name:'ข้าวสาร',category:'อาหาร',kind:'consumable',owner:'ส่วนกลาง',locationId:id2,quantity:3,minQty:1,unit:'ถุง',price:180,createdAt:stamp(),archived:false},{id:'BTH-001',name:'น้ำยาซักผ้า',category:'ของใช้ในบ้าน',kind:'consumable',owner:'ส่วนกลาง',locationId:id4,quantity:1,minQty:2,unit:'ขวด',price:139,createdAt:stamp(),archived:false}],

 shopping:[{id:'shop-demo1',name:'กระดาษทิชชู่',quantity:2,unit:'แพ็ก',done:false,createdAt:stamp()},{id:'shop-demo2',name:'อาหารแมว',quantity:1,unit:'ถุง',done:false,createdAt:stamp()}],
 expenses:[{id:'expense-demo1',name:'อาหารแมว',category:'ของแมว',amount:750,date:now,createdAt:stamp()},{id:'expense-demo2',name:'ซื้อของเข้าบ้าน',category:'อาหาร',amount:620,date:now,createdAt:stamp()}]
};}
function loadDemo(){try{const raw=localStorage.getItem(DEMO_KEY);if(raw){const parsed=JSON.parse(raw);if(['locations','items','movements','shopping','expenses'].every(k=>Array.isArray(parsed[k])))return parsed;}}catch(e){console.warn(e);}return sampleData();}
const DATA_KEYS=['locations','items','movements','shopping','expenses'];
const state={mode:'demo',page:'dashboard',data:loadDemo(),uid:null,user:null,fb:null,auth:null,db:null,unsubs:[],search:'',category:'',scanActive:false,scanning:false,scannerStream:null,scanTimer:0,bulk:{text:'',year:new Date().getFullYear(),rows:[],reviewed:false}};
const navs=[['dashboard','⌂','ภาพรวม'],['inventory','▣','สต็อกสินค้า'],['locations','▤','Location'],['movements','⇄','ประวัติเบิก-รับ'],['shopping','☑','รายการที่ต้องซื้อ'],['finance','◫','การเงิน / เทรนด์'],['import','↧','วางข้อความรายจ่าย'],['settings','⚙','ตั้งค่า / เชื่อมต่อ']];
const titles={dashboard:['ภาพรวมบ้านของฉัน','ค้นหาของที่เก็บไว้และติดตามสถานะสต็อก'],inventory:['รายการสต็อกสินค้า','จัดการสินค้า เจ้าของ และตำแหน่งจัดเก็บ'],locations:['แผนผัง Location','กำหนดรหัสห้อง ตู้ ชั้น และช่องเก็บของ'],movements:['ประวัติการเคลื่อนไหว','ตรวจสอบการรับเข้า เบิกใช้ และย้ายที่เก็บ'],shopping:['รายการที่ต้องซื้อ','ของที่ใกล้หมดและรายการซื้อที่เพิ่มเอง'],finance:['การเงินและเทรนด์รายเดือน','บันทึกค่าใช้จ่ายและดูแนวโน้มย้อนหลัง'],import:['นำเข้ารายจ่ายจากแชต','วางข้อความหลายบรรทัด ตรวจข้อมูล แล้วบันทึกลงระบบ'],settings:['ตั้งค่าและการเชื่อมต่อ','เชื่อมต่อ Firebase และสำรองข้อมูล']};
function persist(){if(state.mode==='demo'){try{localStorage.setItem(DEMO_KEY,JSON.stringify(state.data));}catch(e){toast('พื้นที่เก็บข้อมูลในเบราว์เซอร์เต็ม กรุณาสำรองข้อมูล','err');}}render();}
function collectionName(k){return k;}
function C(k){return state.fb.collection(state.db,'users',state.uid,collectionName(k));}
function D(k,id){return state.fb.doc(state.db,'users',state.uid,collectionName(k),id);}

function parseYear(y){const n=Number(y);if(!Number.isInteger(n)||n<0)return null;if(n<100)return n<=40?2000+n:1957+n;return n>=2400?n-543:n;}
function findMessageYear(raw, fallback){
 const head=raw.match(/(?:เดือน\s*)?(?:มกราคม|มกรา|มค|กุมภาพันธ์|กุมภา|กพ|มีนาคม|มีนา|มีค|เมษายน|เมษา|เมย|พฤษภาคม|พฤษภา|พค|มิถุนายน|มิถุนา|มิย|กรกฎาคม|กรกฎา|กค|สิงหาคม|สิงหา|สค|กันยายน|กันยา|กย|ตุลาคม|ตุลา|ตุล|ตค|พฤศจิกายน|พฤศจิกา|พย|ธันวาคม|ธันวา|ธค)\s*\.?\s*(\d{2,4})/i);
 return head ? (parseYear(head[1]) || fallback) : fallback;
}
function validISO(d){if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return false;const [y,m,day]=d.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,day));return dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===day;}
function stableImportHash(text){let a=2166136261,b=2246822519;for(const ch of text){const cp=ch.codePointAt(0);a=Math.imul(a^cp,16777619);b=Math.imul(b^cp,3266489917);}return (a>>>0).toString(36)+'-'+(b>>>0).toString(36);}

function parseExpenseLine(original, year, lineNumber){
 let txt=original.trim().replace(/[\u200b-\u200d\ufeff]/g,'').replace(/^[-•*]\s*/,'').replace(/^\d{1,3}[.)．]\s*/, '').trim();

 // Date is the last day/month(/year) in the message. For a header year 69 = Buddhist 2569 = 2026.
 const matches=[...txt.matchAll(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})(?:\s*[\/\-.]\s*(\d{2,4}))?/g)];

 else warning='ไม่พบวันที่ กรุณาระบุเอง';
 // Price commonly appears as "ทิชชู่186" or "อาหารแมว=179". '=2 ถุง' after the price is a note, not a price.
 const monetary=txt.match(/(?:ราคา|รวม|ยอด|฿)\s*[:=]?\s*([\d,]+(?:\.\d{1,2})?)/);
 if(monetary){amount=Number(monetary[1].replace(/,/g,''));name=txt.slice(0,monetary.index).trim();}
 else{
   const main=txt.split(/\s*=\s*(?=\d+\s*(?:ถุง|ชิ้น|ขวด|กล่อง|กล|แพ็ก|แพ็ค|แพค|กก|kg|กิโล|ตัว|อัน|ลูก|มัด|คู่|ซอง|ชุด|ครั้ง))|\s+(?:จำนวน|ใช้ไป|ใช้แล้ว)\s*\d+/i)[0];
   const nums=[...main.matchAll(/\d[\d,]*(?:\.\d{1,2})?/g)];
   if(nums.length){const hit=nums.at(-1);amount=Number(hit[0].replace(/,/g,''));name=main.slice(0,hit.index).replace(/[=:\-\s฿]+$/,'').trim();if(nums.length>1 && nums.some(x=>x.index<hit.index))warning=warning ? warning+'; มีตัวเลขหลายตำแหน่ง' : 'มีตัวเลขหลายตำแหน่ง โปรดตรวจราคา';}
 }

 if(!name||name.length>100)warning=(warning?warning+'; ':'')+'ตรวจชื่อสินค้า';
 if(!Number.isFinite(amount)||amount<=0||amount>999999999){amount=null;warning=(warning?warning+'; ':'')+'ตรวจจำนวนเงิน';}
 if(!date)warning=(warning?warning+'; ':'')+'ตรวจวันที่';

function parseBulkText(raw,yearOverride){
 const fallback=parseYear(yearOverride)||new Date().getFullYear();const parsedYear=findMessageYear(raw,fallback),rows=[];
 for(const [i,line] of raw.split(/\r?\n/).entries()){
  const clean=line.trim();if(!clean)continue;
  // A standalone month heading is metadata and not a purchase.
  if(/^(?:รายการ)?\s*เดือน\s*[^\d\n]*\d{2,4}\s*$/i.test(clean) || /^(?:รายจ่าย|ของที่ซื้อ|รายการซื้อ)\s*[:：]?\s*$/.test(clean))continue;
  // Other notes are not purchases. Keep only entries with a date or an ordinal.
  if(!/(?:\d{1,2}[\/.\-]\d{1,2}|^\d{1,3}[.)．])/.test(clean))continue;
  rows.push(parseExpenseLine(clean,parsedYear,i+1));
 }
 return rows;
}

function readBulkRows(){
 const nodes=[...document.querySelectorAll('[data-import-row]')];
 if(!nodes.length)return state.bulk.rows;
 state.bulk.rows=nodes.map((el,i)=>{const input=key=>el.querySelector(`[data-bulk-field="${key}"]`);return {...state.bulk.rows[i],name:input('name').value.trim(),amount:Number(input('amount').value),date:input('date').value,category:input('category').value,checked:input('checked').checked};});

function updateImportSummary(){
 const area=$('#importSummary');if(!area)return;
 const rows=readBulkRows(),selected=rows.filter(r=>r.checked),valid=selected.filter(r=>r.name&&r.name.length<=100&&Number.isFinite(r.amount)&&r.amount>0&&r.amount<=999999999&&validISO(r.date));
 const occurrences=new Map(),existing=new Set(state.data.expenses.map(x=>x.id));let duplicates=0,total=0,invalid=selected.length-valid.length;
 for(const r of valid){const key=recordKey(r.name,r.amount,r.date),n=(occurrences.get(key)||0)+1;occurrences.set(key,n);const id='imp-'+stableImportHash(recordKey(r.name,r.amount,r.date,n));if(existing.has(id)){duplicates++;}else total+=r.amount;}
 const all=selected.length-duplicates-invalid;
 area.innerHTML=`<div class="import-totals"><div class="import-total"><small>เลือกบันทึก</small><b>${num(selected.length)} รายการ</b></div><div class="import-total"><small>เพิ่มใหม่โดยประมาณ</small><b>${num(Math.max(0,all))} รายการ</b></div><div class="import-total"><small>ยอดรวมเพิ่มใหม่</small><b>${baht(total)}</b></div><div class="import-total"><small>เคยนำเข้าแล้ว / ข้อมูลผิด</small><b>${duplicates} / ${invalid}</b></div></div>`;
 const scanOcc=new Map();for(const [i,r] of rows.entries()){
  const el=document.querySelector(`[data-import-row="${i}"]`);if(!el)continue;
  const validRow=r.name&&r.name.length<=100&&r.amount>0&&Number.isFinite(r.amount)&&validISO(r.date);
  const key=recordKey(r.name,r.amount||0,r.date),n=(scanOcc.get(key)||0)+1;scanOcc.set(key,n);const isDup=validRow&&existing.has('imp-'+stableImportHash(recordKey(r.name,r.amount,r.date,n)));
  el.classList.toggle('invalid',!validRow);el.classList.toggle('suspect',!!r.warning&&!!validRow&&!isDup);el.classList.toggle('duplicate',!!isDup);

 }
}
let bulkSaving=false;
async function saveBulkImport(){
 if(bulkSaving)return;const rows=readBulkRows().filter(x=>x.checked);if(!rows.length)throw Error('กรุณาเลือกรายการที่ต้องการบันทึก');
 const faulty=rows.filter(r=>!r.name||r.name.length>100||!Number.isFinite(r.amount)||r.amount<=0||r.amount>999999999||!validISO(r.date));
 if(faulty.length)throw Error('กรุณาตรวจบรรทัด '+faulty.map(x=>x.lineNumber).join(', ')+' (ชื่อ ราคา หรือวันที่ไม่ครบ)');
 const seen=new Map(),existing=new Set(state.data.expenses.map(x=>x.id)),unique=[],skipped=[];
 for(const r of rows){const base=recordKey(r.name,r.amount,r.date),occ=(seen.get(base)||0)+1;seen.set(base,occ);const id='imp-'+stableImportHash(recordKey(r.name,r.amount,r.date,occ));if(existing.has(id)){skipped.push(r);continue;}unique.push({...r,id,importKey:recordKey(r.name,r.amount,r.date,occ)});}
 if(!unique.length){toast(`รายการที่เลือก ${skipped.length} รายการ เคยนำเข้าแล้ว ไม่มีการบันทึกซ้ำ`);return;}
 if(!confirm(`บันทึกรายจ่าย ${unique.length} รายการ รวม ${baht(unique.reduce((s,r)=>s+r.amount,0))}${skipped.length?' (ข้ามรายการซ้ำ '+skipped.length+' รายการ)':''}\n\nรายการนี้ไม่เพิ่มจำนวนสินค้าในสต็อก ยืนยันหรือไม่?`))return;
 bulkSaving=true;const btn=document.querySelector('[data-action="save-import"]');if(btn)btn.disabled=true;
 try{
  const docs=unique.map(r=>({id:r.id,name:r.name,category:r.category,amount:money(r.amount),date:r.date,createdAt:stamp(),source:'chat-import',sourceLine:r.original,importKey:r.importKey}));
  if(state.mode==='demo'){state.data.expenses.push(...docs);persist();}
  else { // 200 writes per batch; each batch is committed atomically
   for(let from=0;from<docs.length;from+=200){const batch=state.fb.writeBatch(state.db);for(const d of docs.slice(from,from+200))batch.set(D('expenses',d.id),d);await batch.commit();}
  }
  state.bulk.rows=[];state.bulk.text='';state.bulk.reviewed=false;state.page='finance';render();toast(`บันทึกรายจ่าย ${docs.length} รายการสำเร็จ${skipped.length?' (ข้ามรายการที่เคยบันทึก '+skipped.length+')':''}`);
 }finally{bulkSaving=false;if(btn)btn.disabled=false;}
}

function stopCamera(){state.scanActive=false;if(state.scanTimer)cancelAnimationFrame(state.scanTimer);state.scanTimer=0;state.scannerStream?.getTracks().forEach(t=>t.stop());state.scannerStream=null;}
async function startCamera(){if(!('BarcodeDetector' in window)){toast('เบราว์เซอร์นี้ยังไม่รองรับการสแกนด้วยกล้อง ให้ใช้เครื่องสแกน USB หรือพิมพ์รหัส','err');return;}if(!navigator.mediaDevices?.getUserMedia){toast('การใช้กล้องต้องเปิดเว็บผ่าน HTTPS หรือ localhost','err');return;}if(state.scanActive)return;try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});state.scannerStream=stream;state.scanActive=true;const panel=$('#cameraPanel');if(!panel){stopCamera();return;}panel.innerHTML='<div class="scanner"><video id="scanVideo" muted autoplay playsinline></video></div><button class="btn danger sm" data-action="camera-off" style="margin-top:8px">ปิดกล้อง</button>';const video=$('#scanVideo');video.srcObject=stream;await video.play();const formats=await window.BarcodeDetector.getSupportedFormats();const detector=new BarcodeDetector({formats:['code_128','code_39','ean_13','qr_code'].filter(x=>formats.includes(x))});let throttle=0;async function tick(t){if(!state.scanActive)return;if(t-throttle>350&&video.readyState>=2&&!state.scanning){throttle=t;state.scanning=true;try{const found=await detector.detect(video);if(found.length){const hit=code(found[0].rawValue);stopCamera();findScanned(hit);return;}}catch(e){console.warn('scan frame',e);}finally{state.scanning=false;}}state.scanTimer=requestAnimationFrame(tick);}state.scanTimer=requestAnimationFrame(tick);}catch(e){stopCamera();toast('เปิดกล้องไม่ได้: '+e.message,'err');}}

async function createItem(o){const initial=Number(o.quantity);const item={id:o.id,name:o.name,category:o.category,kind:o.kind,owner:o.owner,locationId:o.locationId,quantity:initial,minQty:o.minQty,unit:o.unit,price:o.price,archived:false,createdAt:stamp()};const m={id:uuid(),itemId:item.id,itemName:item.name,type:'IN',quantity:initial,before:0,after:initial,locationFrom:item.locationId,locationTo:item.locationId,note:'ยอดตั้งต้นเมื่อสร้างสินค้า',actor:state.user?.displayName||'ผู้ใช้ในบ้าน',at:stamp()};if(state.mode==='demo'){if(state.data.items.some(x=>x.id===item.id))throw Error('รหัสสินค้านี้มีอยู่แล้ว');state.data.items.push(item);if(initial>0)state.data.movements.push(m);persist();return;}
 await state.fb.runTransaction(state.db,async tx=>{const ref=D('items',item.id);const old=await tx.get(ref);if(old.exists())throw Error('รหัสสินค้านี้มีอยู่แล้วในฐานข้อมูล');tx.set(ref,item);if(initial>0)tx.set(D('movements',m.id),m);});}
async function stockChange(id,type,qty,actor,note,recordExpense,unitPrice){const i=activeItems().find(x=>x.id===id);if(!i)throw Error('ไม่พบสินค้า');if(!Number.isInteger(qty)||qty<1)throw Error('จำนวนต้องเป็นจำนวนเต็มตั้งแต่ 1');const movId=uuid(),expId=uuid(),at=stamp();if(state.mode==='demo'){if(type==='OUT'&&i.quantity<qty)throw Error('ยอดคงเหลือไม่เพียงพอ');const before=i.quantity,after=before+(type==='IN'?qty:-qty);i.quantity=after;state.data.movements.push({id:movId,itemId:id,itemName:i.name,type,quantity:qty,before,after,locationFrom:i.locationId,locationTo:i.locationId,actor,note,at});if(recordExpense)state.data.expenses.push({id:expId,name:'ซื้อ '+i.name,category:i.category,amount:money(qty*unitPrice),date:today(),createdAt:at,linkedMovementId:movId});persist();return;}
 await state.fb.runTransaction(state.db,async tx=>{const itemRef=D('items',id);const snap=await tx.get(itemRef);if(!snap.exists()||snap.data().archived)throw Error('สินค้าไม่มีอยู่ใน Cloud แล้ว');const fresh=snap.data(),before=Number(fresh.quantity||0);if(type==='OUT'&&before<qty)throw Error('ยอดคงเหลือไม่เพียงพอ');const after=before+(type==='IN'?qty:-qty);tx.update(itemRef,{quantity:after});tx.set(D('movements',movId),{id:movId,itemId:id,itemName:fresh.name,type,quantity:qty,before,after,locationFrom:fresh.locationId,locationTo:fresh.locationId,actor,note,at});if(recordExpense)tx.set(D('expenses',expId),{id:expId,name:'ซื้อ '+fresh.name,category:fresh.category,amount:money(qty*unitPrice),date:today(),createdAt:at,linkedMovementId:movId});});}
async function moveItem(id,to,note){const i=activeItems().find(x=>x.id===id);if(!i)throw Error('ไม่พบสินค้า');if(i.locationId===to)throw Error('ตำแหน่งใหม่ต้องต่างจากตำแหน่งเดิม');if(!getLoc(to))throw Error('ไม่พบ Location ปลายทาง');const mId=uuid(),at=stamp();if(state.mode==='demo'){const from=i.locationId;i.locationId=to;state.data.movements.push({id:mId,itemId:id,itemName:i.name,type:'MOVE',quantity:0,before:i.quantity,after:i.quantity,locationFrom:from,locationTo:to,note,actor:'ผู้ใช้ในบ้าน',at});persist();return;}

let saving=false;
async function submitForm(form){if(saving)return;saving=true;const submit=form.querySelector('button[type="submit"]');if(submit)submit.disabled=true;const f=Object.fromEntries(new FormData(form));const typ=form.dataset.form;try{
 if(typ==='item'){const id=code(f.id);if(!validCode(id))throw Error('รหัสต้องมี 2–48 ตัว ใช้ A-Z, 0-9, - หรือ _');const it={id,name:f.name.trim(),category:f.category,kind:f.kind,owner:f.owner.trim(),locationId:form.dataset.id?activeItems().find(x=>x.id===form.dataset.id)?.locationId:f.locationId,unit:f.unit.trim(),minQty:Number(f.minQty),price:money(f.price)};if(!getLoc(it.locationId))throw Error('กรุณาเลือก Location');if(!positiveInt(it.minQty)||it.price<0)throw Error('จำนวนขั้นต่ำหรือราคาไม่ถูกต้อง');if(form.dataset.id){await writeData('items',form.dataset.id,{name:it.name,category:it.category,kind:it.kind,owner:it.owner,unit:it.unit,minQty:it.minQty,price:it.price});}else{it.quantity=Number(f.quantity);if(!positiveInt(it.quantity))throw Error('จำนวนสินค้าไม่ถูกต้อง');await createItem(it);}}
 else if(typ==='location'){const id=code(f.id);if(!validCode(id))throw Error('รหัส Location ไม่ถูกต้อง');if(state.data.locations.some(x=>x.id===id))throw Error('รหัส Location ซ้ำ');await writeData('locations',id,{id,room:f.room.trim(),name:f.name.trim(),createdAt:stamp()},'add');}
 else if(typ==='stock'){const qty=Number(f.quantity);if(!Number.isInteger(qty)||qty<1)throw Error('จำนวนต้องเป็นจำนวนเต็มมากกว่า 0');const unitPrice=money(f.unitPrice);if(f.recordExpense==='yes'&&(!Number.isFinite(unitPrice)||unitPrice<0))throw Error('ราคาต่อหน่วยไม่ถูกต้อง');await stockChange(form.dataset.id,form.dataset.type,qty,(f.actor||'ผู้ใช้ในบ้าน').trim(),(f.note||'').trim(),f.recordExpense==='yes',unitPrice);}
 else if(typ==='move'){await moveItem(form.dataset.id,f.locationId,(f.note||'').trim());}
 else if(typ==='shop'){const obj={id:uuid(),name:f.name.trim(),quantity:Number(f.quantity),unit:f.unit.trim(),done:false,createdAt:stamp()};if(!Number.isInteger(obj.quantity)||obj.quantity<1)throw Error('จำนวนไม่ถูกต้อง');await writeData('shopping',obj.id,obj,'add');}
 else if(typ==='expense'){const val=Number(f.amount);if(!Number.isFinite(val)||val<=0||!/^\d{4}-\d{2}-\d{2}$/.test(f.date))throw Error('จำนวนเงินหรือวันที่ไม่ถูกต้อง');const obj={id:uuid(),name:f.name.trim(),amount:money(val),category:f.category,date:f.date,createdAt:stamp()};await writeData('expenses',obj.id,obj,'add');}
 else if(typ==='scan'){findScanned(code(f.barcode));return;}
 stopCamera();$('#modalHost').innerHTML='';toast('บันทึกรายการสำเร็จ');if(state.mode==='demo')render();

let firebaseLoading=null;
async function setupFirebase(){if(state.fb)return;if(firebaseLoading)return firebaseLoading;firebaseLoading=(async()=>{const url=`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;const [app,auth,db]=await Promise.all([import(url+'firebase-app.js'),import(url+'firebase-auth.js'),import(url+'firebase-firestore.js')]);const instance=app.initializeApp(FIREBASE_CONFIG);state.fb={...auth,...db};state.auth=auth.getAuth(instance);state.db=db.getFirestore(instance);auth.onAuthStateChanged(state.auth,user=>{state.unsubs.forEach(fn=>fn());state.unsubs=[];state.user=user;state.uid=user?.uid||null;if(user){state.mode='cloud';state.data=Object.fromEntries(DATA_KEYS.map(k=>[k,[]]));DATA_KEYS.forEach(k=>{const unsub=db.onSnapshot(C(k),snap=>{state.data[k]=snap.docs.map(d=>({...d.data(),id:d.id}));render();},err=>{console.error(err);toast('อ่านข้อมูล '+k+' ไม่สำเร็จ: '+err.message,'err');});state.unsubs.push(unsub);});}else{state.mode='demo';state.data=loadDemo();}render();});})().catch(e=>{firebaseLoading=null;throw e;});return firebaseLoading;}

case'clear-import':if(state.bulk.text&&!confirm('ล้างข้อความและตัวอย่างการนำเข้าหรือไม่?'))break;state.bulk.text='';state.bulk.rows=[];state.bulk.reviewed=false;render();break;
case'save-import':await saveBulkImport();break;
case'add-item':itemModal();break;case'edit-item':itemModal(activeItems().find(x=>x.id===id));break;case'add-location':locationModal();break;case'add-shopping':shopModal();break;case'add-expense':expenseModal();break;case'stock':stockModal(activeItems().find(x=>x.id===id),el.dataset.type);break;case'move':moveModal(activeItems().find(x=>x.id===id));break;case'barcode':barcodeModal(activeItems().find(x=>x.id===id));break;case'scan':scanModal();break;case'close':stopCamera();$('#modalHost').innerHTML='';break;case'camera-on':await startCamera();break;case'camera-off':stopCamera();$('#cameraPanel').innerHTML='';break;case'print-barcode':printLabel(id);break;case'export':exportJSON();break;case'login':await login();break;case'logout':await logout();break;
case'remove-shopping':{if(!confirm('ลบรายการซื้อนี้?'))return;try{if(state.mode==='demo'){state.data.shopping=state.data.shopping.filter(x=>x.id!==id);persist();}else await state.fb.deleteDoc(D('shopping',id));}catch(e){toast(e.message,'err');}break;}
case'reset-demo':if(state.mode==='demo'&&confirm('ล้างรายการ DEMO ที่แก้ไขไว้ทั้งหมด และคืนค่าตัวอย่าง?')){state.data=sampleData();persist();toast('คืนค่าข้อมูลตัวอย่างแล้ว');}break;
}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){e.preventDefault();act(b.dataset.action,b).catch(err=>toast(err.message,'err'));}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(f){e.preventDefault();submitForm(f);}});
document.addEventListener('input',e=>{if(e.target?.id==='itemSearch'){state.search=e.target.value;const s=e.target.selectionStart;render();const n=$('#itemSearch');n?.focus();n?.setSelectionRange(s,s);}if(e.target?.closest('[data-import-row]'))updateImportSummary();});
document.addEventListener('change',async e=>{if(e.target?.closest('[data-import-row]'))updateImportSummary();if(e.target?.id==='categoryFilter'){state.category=e.target.value;render();}const id=e.target?.dataset?.shopCheck;if(id){const done=e.target.checked;try{if(state.mode==='demo'){const item=state.data.shopping.find(x=>x.id===id);if(item){item.done=done;persist();}}else await state.fb.updateDoc(D('shopping',id),{done});}catch(err){toast(err.message,'err');render();}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalHost').innerHTML){stopCamera();$('#modalHost').innerHTML='';}});
render();if(configured())setupFirebase().catch(e=>toast('Firebase SDK โหลดไม่ได้: '+e.message,'err'));
})();
</script>
</body>
</html>
